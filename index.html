<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Trail to 30</title>
<style>
/* The Trail to 30. Look: Arizona highway signs on asphalt, with a pixel desert road up top.
   System fonts only and no outside files, so it loads on a locked-down school network. */
:root {
  --asphalt: #2c2f36; --asphalt2: #3a3e47; --asphalt3: #4a4f5a;
  --paint: #f2c230; --paint-soft: #fff4c4;
  --green: #0b6b4d; --blue: #1d58a6; --brown: #6b4423; --red: #b3261e;
  --face: #f6f7f1; --white: #ffffff; --ink: #14161a; --ink2: #4b505a; --rule: #d3d6cb;
  --good: #17713f; --good-bg: #dff1e5; --bad: #a6241c; --bad-bg: #f8dfdc; --info-bg: #e3ebf6;
  --dash: #e9ebee; --dash2: #aab0bb;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--asphalt); color: var(--ink); font: 16px/1.5 Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
button, input, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
#app { max-width: 1100px; margin: 0 auto; padding: 0 12px 28px; }

/* ---------- the road strip ---------- */
#strip { position: sticky; top: 0; z-index: 5; background: var(--asphalt); padding-top: 8px; }
#strip svg { display: block; width: 100%; height: auto; border-radius: 10px; shape-rendering: crispEdges; }
#strip .sprite { transition: transform .9s steps(18); }

/* ---------- layout ---------- */
#wrap { display: grid; grid-template-columns: minmax(0, 1fr) 272px; gap: 14px; margin-top: 12px; align-items: start; }
#wrap.solo { grid-template-columns: minmax(0, 1fr); max-width: 760px; margin-left: auto; margin-right: auto; }
#wrap.solo #side { display: none; }
#side { position: sticky; top: 132px; }
@media (max-width: 820px) { #wrap { grid-template-columns: 1fr; } #side { position: static; order: -1; } #strip { position: static; }
  #side .dash { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; } #side .dash > h2, #side .dash > .who, #side .dash > .have, #side .dash > .tools { grid-column: 1 / -1; } #side .nw { border-top: 0; padding-top: 0; }
  #side dt.in, #side dd.in { display: none; } }
@media (max-width: 480px) { #side .dash { grid-template-columns: 1fr; } }

/* ---------- pixel lettering ---------- */
.pix { display: flex; flex-wrap: wrap; gap: .5em .62em; align-items: center; line-height: 0; }
.pix svg { display: block; shape-rendering: crispEdges; }

/* ---------- signs (cards) ---------- */
.sign { background: var(--face); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 rgba(0, 0, 0, .35); }
.sign-head { border-radius: 12px 12px 0 0; }
.sign + .sign { margin-top: 14px; }
.sign-head { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 3px solid var(--ink); background: var(--green); color: #fff; }
.sign-head .ico { flex: none; width: 34px; height: 34px; }
.sign[data-sign="hazard"] .sign-head { background: var(--paint); color: var(--ink); }
.sign[data-sign="info"] .sign-head { background: var(--blue); }
.sign[data-sign="fun"] .sign-head { background: var(--brown); }
.sign[data-sign="stop"] .sign-head { background: var(--red); }
.sign[data-sign="math"] .sign-head { background: var(--white); color: var(--ink); }
.sign-body { padding: 16px 18px 18px; }
.sign-body > p { max-width: 66ch; }
.sign-body > p + p { margin-top: .8em; }
.sub { color: var(--ink2); }
.small { font-size: .9rem; }

.opts { display: grid; gap: 8px; margin-top: 14px; }
.opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: var(--white); border: 2px solid var(--ink); border-radius: 10px; padding: 9px 12px; cursor: pointer; }
.opt .n { flex: none; width: 28px; height: 28px; margin-top: 1px; border-radius: 6px; background: var(--green); color: #fff; font-weight: 700; display: grid; place-items: center; }
.opt .t { display: block; font-weight: 600; }
.opt .s { display: block; color: var(--ink2); font-size: .93rem; }
.opt .why { display: block; color: var(--bad); font-size: .93rem; font-weight: 600; }
.opt .amt { margin-left: auto; padding-left: 12px; white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
.opt:hover:not(:disabled) { background: var(--paint-soft); }
.opt:disabled { cursor: not-allowed; border-style: dashed; background: transparent; }
.opt:disabled .n { background: var(--ink2); } .opt:disabled .t, .opt:disabled .s { opacity: .6; }
.opt.cur { background: var(--paint-soft); box-shadow: inset 5px 0 0 var(--paint); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.sign-head :focus-visible, #side :focus-visible { outline-color: var(--paint); }

.picked { margin-top: 14px; padding: 8px 12px; border-left: 5px solid var(--green); background: var(--white); border-radius: 0 8px 8px 0; }
.outcome { margin-top: 12px; }
.outcome p + p { margin-top: .7em; }
.chips { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 3px 10px; border-radius: 99px; font-size: .93rem; border: 1.5px solid currentColor; }
.chip.good { color: var(--good); background: var(--good-bg); } .chip.bad { color: var(--bad); background: var(--bad-bg); } .chip.info { color: var(--blue); background: var(--info-bg); }
.go { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
.btn { border: 2px solid var(--ink); border-radius: 10px; padding: 10px 18px; font-weight: 700; background: var(--white); cursor: pointer; }
.btn.primary { background: var(--paint); box-shadow: 0 3px 0 var(--ink); }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn:hover { filter: brightness(.96); }
.btn.sm { padding: 7px 12px; font-weight: 600; font-size: .93rem; }
.btn.quiet { border-color: transparent; background: transparent; text-decoration: underline; font-weight: 500; padding: 10px 6px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.key { font-size: .85rem; color: var(--ink2); }

/* ---------- dashboard ---------- */
#side .dash { background: var(--asphalt2); color: var(--dash); border-radius: 14px; padding: 14px; border: 2px solid var(--asphalt3); }
#side h2 { font-size: 1.05rem; line-height: 1.25; }
#side .who { color: var(--dash2); font-size: .9rem; margin-top: 2px; }
#side dl { margin: 12px 0 0; display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; font-variant-numeric: tabular-nums; }
#side dt { color: var(--dash2); } #side dd { margin: 0; text-align: right; font-weight: 600; }
#side dt.in { padding-left: 12px; font-size: .88rem; } #side dd.in { font-size: .88rem; font-weight: 400; }
#side .nw { margin-top: 12px; padding-top: 12px; border-top: 2px dashed var(--asphalt3); }
#side .nw .lab { color: var(--dash2); font-size: .9rem; margin-bottom: 6px; }
.meter { margin-top: 12px; }
.meter .row { display: flex; justify-content: space-between; font-size: .9rem; color: var(--dash2); }
.meter .row b { color: var(--dash); }
.meter .bar { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; margin-top: 4px; }
.meter .bar i { height: 10px; background: var(--asphalt3); }
.meter .bar i.on { background: var(--paint); }
#side .have { margin-top: 12px; color: var(--dash2); font-size: .9rem; }
#side .tools { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
#side .tools button { background: transparent; color: var(--dash); border: 1.5px solid var(--dash2); border-radius: 8px; padding: 5px 10px; font-size: .88rem; cursor: pointer; }
#side .tools button:hover { background: var(--asphalt3); }

/* ---------- yearly plan ---------- */
.plan-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 980px) { .plan-grid { grid-template-columns: 1fr; } }
.rows { display: grid; gap: 6px; align-content: start; }
.rowbtn { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; width: 100%; text-align: left; background: var(--white); border: 2px solid var(--ink); border-radius: 10px; padding: 6px 12px; cursor: pointer; align-items: baseline; }
.rowbtn .lab { color: var(--ink2); font-size: .84rem; }
.rowbtn .val { font-weight: 600; } .rowbtn .cost { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.rowbtn .chg { font-size: .84rem; color: var(--blue); text-decoration: underline; text-align: right; }
.rowbtn .fx { font-size: .84rem; color: var(--ink2); text-align: right; max-width: 22ch; }
.actionbar { position: sticky; bottom: 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px -18px -18px; padding: 10px 18px; background: var(--face); border-top: 3px solid var(--ink); border-radius: 0 0 13px 13px; }
.actionbar .lo { font-size: .95rem; } .actionbar .lo b { font-variant-numeric: tabular-nums; } .actionbar .sp { flex: 1; }
.rowbtn:hover:not(:disabled) { background: var(--paint-soft); }
.rowbtn.flag { box-shadow: 0 0 0 3px var(--paint); }
.rowbtn:disabled { cursor: default; background: transparent; border-style: dashed; }
.rowopen { border: 2px solid var(--ink); border-radius: 10px; padding: 10px; background: #ecefe6; }
.rowopen h3 { font-size: 1rem; margin-bottom: 2px; }
.rowopen .opts { margin-top: 8px; }
.stepper { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; background: var(--white); border: 2px solid var(--ink); border-radius: 10px; padding: 8px 12px; }
.stepper .lab { color: var(--ink2); font-size: .84rem; grid-column: 1 / -1; }
.stepper .ctl { display: flex; gap: 4px; align-items: center; }
.stepper input { width: 86px; padding: 5px 6px; border: 2px solid var(--ink); border-radius: 6px; text-align: right; background: var(--white); font-variant-numeric: tabular-nums; }
.stepper button { width: 34px; height: 34px; border: 2px solid var(--ink); border-radius: 6px; background: var(--white); font-weight: 700; cursor: pointer; }
.ledger { background: var(--white); border: 2px solid var(--ink); border-radius: 10px; padding: 10px 12px; align-self: start; }
.ledger h3 { font-size: 1rem; margin-bottom: 4px; }
.ledger table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.ledger td { padding: 2px 0; vertical-align: top; } .ledger td:last-child { text-align: right; white-space: nowrap; padding-left: 10px; }
.ledger tr.sum td { border-top: 2px solid var(--ink); font-weight: 700; padding-top: 5px; }
.ledger tr.gap td { padding-top: 9px; }
.ledger tr.dim td { color: var(--ink2); font-size: .9rem; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.notice { margin-top: 10px; padding: 8px 12px; border-radius: 8px; border-left: 5px solid var(--blue); background: var(--info-bg); font-size: .95rem; }
.notice.warn { border-left-color: var(--red); background: var(--bad-bg); }
.notice.ok { border-left-color: var(--good); background: var(--good-bg); }
.headline { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; margin-bottom: 12px; }

/* ---------- summary & end ---------- */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
@media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }
.tile { background: var(--white); border: 2px solid var(--ink); border-radius: 10px; padding: 10px 12px; }
.tile h3 { font-size: 1rem; margin-bottom: 4px; }
.tile table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tile td { padding: 2px 0; } .tile td:last-child { text-align: right; white-space: nowrap; padding-left: 10px; }
.tile tr.sum td { border-top: 2px solid var(--ink); font-weight: 700; }
.bigdelta { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.plate { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.plate .tile b { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.grade { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.grade .letter { width: 96px; height: 96px; border: 4px solid var(--ink); border-radius: 14px; background: var(--paint); display: grid; place-items: center; }
.bars { display: grid; gap: 6px; margin-top: 6px; }
.bars .b { display: grid; grid-template-columns: 150px 1fr auto; gap: 10px; align-items: center; font-size: .95rem; }
.bars .track { height: 12px; background: #e3e6dc; border-radius: 0 4px 4px 0; }
.bars .fill { height: 12px; background: var(--blue); border-radius: 0 4px 4px 0; min-width: 2px; }
@media (max-width: 560px) { .bars .b { grid-template-columns: 1fr auto; } .bars .track { grid-column: 1 / -1; order: 3; } }
.chart { position: relative; margin-top: 6px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: .86rem; white-space: nowrap; transform: translate(-50%, -130%); display: none; font-variant-numeric: tabular-nums; }
details { margin-top: 8px; } summary { cursor: pointer; color: var(--blue); }
table.data { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; margin-top: 6px; }
table.data th, table.data td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--rule); } table.data th:first-child, table.data td:first-child { text-align: left; }
ol.q { margin: 6px 0 0; padding-left: 22px; } ol.q li + li { margin-top: 6px; }
ul.log { margin: 6px 0 0; padding-left: 20px; } ul.log li { margin-top: 2px; }
.code { font: 700 1.2rem/1 "Roboto Mono", Consolas, monospace; letter-spacing: .12em; background: var(--white); border: 2px dashed var(--ink); border-radius: 8px; padding: 6px 10px; display: inline-block; }

/* ---------- title ---------- */
.title-sign .sign-body { padding: 22px; }
.field { display: grid; gap: 4px; margin-top: 14px; max-width: 360px; }
.field label { font-weight: 600; } .field .hint { color: var(--ink2); font-size: .88rem; }
.field input { padding: 9px 10px; border: 2px solid var(--ink); border-radius: 8px; background: var(--white); }
.hand { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 14px; }
.hand .tile { min-height: 120px; }
.hand .tile .k { color: var(--ink2); font-size: .86rem; } .hand .tile b { display: block; font-size: 1.3rem; margin: 2px 0; }

/* ---------- modal ---------- */
#modal { position: fixed; inset: 0; background: rgba(20, 22, 26, .7); display: none; align-items: flex-start; justify-content: center; padding: 5vh 12px; overflow: auto; z-index: 20; }
#modal.on { display: flex; }
#modal .sign { width: 100%; max-width: 680px; }
#modal textarea { width: 100%; min-height: 120px; border: 2px solid var(--ink); border-radius: 8px; padding: 8px; font: .85rem/1.35 "Roboto Mono", Consolas, monospace; word-break: break-all; background: var(--white); }
#modal h3 { font-size: 1.02rem; margin-top: 14px; } #modal ul { margin: 4px 0 0; padding-left: 20px; } #modal li + li { margin-top: 3px; }
#modal a { color: var(--blue); }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 10px; border: 2px solid var(--paint); max-width: 92vw; display: none; z-index: 30; }
footer.foot { margin-top: 16px; color: var(--dash2); font-size: .86rem; display: flex; gap: 14px; flex-wrap: wrap; }
footer.foot button { background: none; border: 0; color: var(--dash2); text-decoration: underline; cursor: pointer; padding: 0; }
@media (prefers-reduced-motion: reduce) { #strip .sprite { transition: none; } }

</style>
</head>
<body>
<div id="app">
  <header id="strip"></header>
  <div id="wrap" class="solo">
    <main id="main"></main>
    <aside id="side" aria-label="Your money and stats"></aside>
  </div>
</div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<template id="teacher-notes">
  <p>The Trail to 30 is a twelve-turn simulation of life from 18 to 30, built for an Algebra 2 class. A full game takes about 35 to 45 minutes.</p>
  <h3>Running it in class</h3>
  <ul>
    <li><b>Class code.</b> Give the class any short code (for example PERIOD3). Everyone who types it gets the same economy (the same recession year, stock returns, and inflation), the same order of life events, and the same math challenges. Starting hands and dice rolls inside events still differ. Leave it blank and every game is fully random.</li>
    <li><b>Saving.</b> The game saves on the Chromebook at the start of each year. The Save code button gives a code that works on any device. If Chromebooks clear browser data, have students paste the code into a Canvas text box before they close the tab.</li>
    <li><b>Turning it in.</b> The last screen has a Copy my results button. Students paste the text into a Canvas assignment or screenshot the page. Each result carries a six-character proof code made from the name, class code, and final numbers.</li>
  </ul>
  <h3>Check a proof code</h3>
  <p class="small sub">Type the values exactly as they appear in the student's results.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:6px">
    <input id="pv-name" placeholder="Name" aria-label="Name" style="padding:6px;border:2px solid #14161a;border-radius:6px">
    <input id="pv-cls" placeholder="Class code (or blank)" aria-label="Class code" style="padding:6px;border:2px solid #14161a;border-radius:6px">
    <input id="pv-nw" placeholder="Net worth, e.g. -12340" aria-label="Net worth" style="padding:6px;border:2px solid #14161a;border-radius:6px">
    <input id="pv-cr" placeholder="Credit score" aria-label="Credit score" style="padding:6px;border:2px solid #14161a;border-radius:6px">
    <input id="pv-hp" placeholder="Happiness" aria-label="Happiness" style="padding:6px;border:2px solid #14161a;border-radius:6px">
    <input id="pv-gr" placeholder="Grade letter" aria-label="Grade letter" style="padding:6px;border:2px solid #14161a;border-radius:6px">
  </div>
  <p style="margin-top:6px">Proof code should be: <span class="code" id="pv-out">------</span></p>
  <h3>The math inside</h3>
  <ul>
    <li><b>Exponential growth and decay:</b> savings, the index fund, student loans, credit card balances, car depreciation, home values.</li>
    <li><b>Loan payments:</b> car loans, mortgages, and the 10-year versus 20-year student loan choice all use the amortization formula M = P&middot;r / (1 &minus; (1 + r)<sup>&minus;n</sup>).</li>
    <li><b>Linear models and systems:</b> comparing job offers, phone plans, and rent against income.</li>
    <li><b>Piecewise functions:</b> federal income tax brackets.</li>
    <li><b>Logarithms:</b> doubling time.</li>
    <li><b>Expected value:</b> the lottery. Tickets pay back roughly 35 to 40 cents per dollar here, and the end screen shows what the same money would have become if invested.</li>
    <li>Six optional "Do the math" questions appear during the game, worth a small cash bonus.</li>
  </ul>
  <h3>Where the numbers come from</h3>
  <ul>
    <li>State University tuition and fees (about $13,900) and the out-of-state price follow <a href="https://admission.asu.edu/aid/resident-first-year" target="_blank" rel="noopener">ASU's 2026-27 figures</a>. Community college uses the <a href="https://www.maricopa.edu/students/tuition-payment-information/tuition-fees" target="_blank" rel="noopener">Maricopa rate of $97 a credit</a>.</li>
    <li>Federal student loans charge 6.52%, the <a href="https://fsapartners.ed.gov/knowledge-center/library/electronic-announcements/2026-06-04/interest-rates-federal-direct-loans-first-disbursed-between-july-1-2026-and-june-30-2027" target="_blank" rel="noopener">2026-27 undergraduate rate</a>, with the $31,000 lifetime federal limit. Borrowing beyond that is a private loan at 9.9% (an estimate).</li>
    <li>Rents are set near 2026 Phoenix listing averages (a one-bedroom at $1,350).</li>
    <li>Taxes use the 2026 federal brackets and $16,100 standard deduction for a single filer, 7.65% for Social Security and Medicare, and Arizona's flat 2.5%.</li>
    <li>Military pay follows the 2026 basic pay table for E-1 through E-4. The Arizona Lottery minimum age is 21 and the Powerball jackpot odds are 1 in 292,201,338.</li>
    <li>Starting salaries are rounded estimates of entry-level pay for each job, and private university, trade school, car, and insurance prices are typical-case estimates. A good extension activity: have students check their job against the Bureau of Labor Statistics Occupational Outlook Handbook.</li>
    <li>Prices and pay rise about 2 to 3% a year, so dollar amounts late in the game are bigger than today's.</li>
  </ul>
  <h3>What it leaves out</h3>
  <ul>
    <li>No children, no graduate school, no need-based grants. Everyone files taxes as single.</li>
    <li>The "head start" money is framed as graduation gifts and summer savings, and every student can choose to live with family.</li>
    <li>Interest builds on all student loans during school, and the income-based plan is a simplified version of the real ones.</li>
    <li>The game stops at 30, when trade and military paths are often ahead of four-year degrees. That is worth a class discussion about what happens by 40.</li>
  </ul>
  <h3>Changing it</h3>
  <p>Every dollar figure, job, and event lives in plain text near the top of the script in index.html (look for COST, SCHOOLS, CAREERS, and EVENTS). Edit, save, and re-upload to GitHub.</p>
</template>

<script>
/* ===== The Trail to 30: game data =====
   Dollar figures are 2026 Phoenix-area estimates, rounded for play.
   Sources for the anchors are listed in the teacher notes. */
var START_AGE = 18, END_AGE = 30;

var COST = {
  fedLoanRate: 0.0652,      // federal undergrad Direct Loan rate, 2026-27
  fedLoanCap: 6500,         // average yearly federal limit for a dependent undergrad
  privLoanRate: 0.099,      // typical private student loan
  ccRate: 0.2499,           // credit card APR
  savRate: 0.04,            // high-yield savings
  mortRate: 0.066,
  partWage: 16.5,           // typical student part-time wage (AZ minimum is $15.15 in 2026)
  stdDeduction: 16100,      // 2026 single filer
  brackets: [[12400, 0.10], [50400, 0.12], [105700, 0.22], [201775, 0.24], [256225, 0.32], [640600, 0.35], [1e12, 0.37]],
  fica: 0.0765, azTax: 0.025,
  homePrice: 290000,
  lottoAge: 21              // Arizona Lottery minimum age
};

var SCHOOLS = {
  uni_in:   { name: 'State University', short: 'State U', tuition: 13900, books: 1300, years: 4, deg: 'bach', minGpa: 2.3,

function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function r100(x) { return Math.round(x / 100) * 100; }
function r10(x) { return Math.round(x / 10) * 10; }
function money(n) { n = Math.round(n); return (n < 0 ? '−$' : '$') + Math.abs(n).toLocaleString('en-US'); }
function pct(x, d) { return (x * 100).toFixed(d == null ? 1 : d) + '%'; }

/* ---------- seeded randomness ---------- */
function hashStr(s) {
  var h = 1779033703 ^ s.length;
  for (var i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^= h >>> 16) >>> 0;
}
function mulberry(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function makeR(next) {
  var R = {
    f: next,
    range: function (a, b) { return a + next() * (b - a); },
    int: function (a, b) { return a + Math.floor(next() * (b - a + 1)); },
    chance: function (p) { return next() < p; },
    pick: function (arr) { return arr[Math.floor(next() * arr.length)]; },
    shuffle: function (arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(next() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; },
    normal: function () { var u = Math.max(1e-9, next()), v = next(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307 * v); },
    money: function (a, b, step) { step = step || 10; return Math.round(R.range(a, b) / step) * step; }
  };
  return R;
}
/* personal stream: state lives in S.rs so saves resume exactly */
function PR(S) {
  return makeR(function () { S.rs = (S.rs + 0x6D2B79F5) | 0; var t = Math.imul(S.rs ^ S.rs >>> 15, 1 | S.rs); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; });
}
/* world stream: same class code -> same economy and same order of events */
function WR(S, salt) { return makeR(mulberry(hashStr(S.world + '|' + salt))); }

/* ---------- the economy, year by year ---------- */
var ECON_CACHE = {};
function econAll(world) {
  if (ECON_CACHE[world]) return ECON_CACHE[world];
  var r = makeR(mulberry(hashStr(world + '|econ')));
  var recAt = r.chance(0.8) ? r.int(2, 9) : -1;
  var out = [], px = 1, rentIdx = 1, homeIdx = 1;
  for (var y = 0; y < 12; y++) {
    var rec = y === recAt, recov = y === recAt + 1 && recAt >= 0;
    var infl = rec ? r.range(0.004, 0.015) : r.range(0.018, 0.034);
    var market = rec ? r.range(-0.34, -0.17) : recov ? r.range(0.13, 0.27) : clamp(0.09 + r.normal() * 0.105, -0.11, 0.29);
    var rentUp = rec ? r.range(-0.02, 0.01) : r.range(0.015, 0.055);
    var homeUp = rec ? r.range(-0.10, -0.03) : r.range(0.01, 0.06);

    else if (ec.recov) await G.show({ sign: 'info', title: 'Recovery', text: 'The recession is over. Hiring picks back up, and people who kept investing through the drop bought stocks on sale.' });
    for (var i = 0; i < evs.length; i++) { if (evs[i].p(S) <= 0) continue; S.used[evs[i].id] = S.yi; await evs[i].run(S, G); }

      if (hp.length) html += '<p class="sub small" style="margin-top:8px">What shapes your happiness: ' + hp.map(function (p) { return esc(p[0]) + ' (' + (p[1] > 0 ? '+' : '−') + Math.abs(p[1]) + ')'; }).join(', ') + '.</p>';
      html += '</div><div class="tile"><h3>Where the money went this year</h3><table>';
      tr('Pay before taxes', money(sum.gross));
      if (sum.benefit > 0) tr('Unemployment checks', money(sum.benefit));
      if (sum.untaxed > 0) tr('GI Bill housing allowance', money(sum.untaxed));
      tr('Taxes', money(-sum.tax));
      if (sum.k401In > 0) tr('Into retirement (' + money(sum.kMatch) + ' was free match)', money(-(sum.k401In - sum.kMatch)));
      tr('Rent, food, and other living costs', money(-sum.spend));
      if (sum.tuition > 0) tr('School bill', money(-sum.tuition));
      sum.events.forEach(function (ev) { tr(esc(ev[0]), signed(ev[1])); });
      if (sum.debtPaid > 0) tr('Loan payments', money(-sum.debtPaid));
      if (sum.invested > 0) tr('Moved into investments', money(-sum.invested));
      if (sum.borrowed > 0) tr('<b>Borrowed in student loans</b>', '<b>' + money(sum.borrowed) + '</b>');
      if (sum.interest > 1) tr('Interest charged on what you owe', '<span class="neg">' + money(sum.interest) + '</span>');
      if (sum.savInt + sum.mktGain > 1 || sum.savInt + sum.mktGain < -1) tr('Interest and market gains you earned', '<span class="' + (sum.savInt + sum.mktGain >= 0 ? 'pos' : 'neg') + '">' + signed(sum.savInt + sum.mktGain) + '</span>');
      html += '</table></div></div>';
      html += contBtn(S.age + 1 >= END_AGE ? 'See how it all turned out' : 'On to age ' + (S.age + 1));
      main.innerHTML = signHtml('info', 'Age ' + S.age + ' in review', html); refreshSide(); drawStrip(S); top();
      var c = main.querySelector('#cont'); c.onclick = function () { res(); }; c.focus({ preventScroll: true });
    });
  };

  /* ---------- the end ---------- */
  function niceStep(span, n) { var raw = span / n, p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), f = raw / p; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p; }
  function shortMoney(v) { var a = Math.abs(v); return (v < 0 ? '−$' : '$') + (a >= 1e6 ? (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M' : a >= 1000 ? Math.round(a / 1000) + 'k' : Math.round(a)); }
  function chartHtml(pts) {
    var W = 640, H = 250, ml = 58, mr = 78, mt = 14, mb = 30;
    var lo = Math.min(0, Math.min.apply(null, pts.map(function (p) { return p.v; }))), hi = Math.max(1000, Math.max.apply(null, pts.map(function (p) { return p.v; })));
    var step = niceStep(hi - lo, 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    function X(a) { return ml + (a - 18) / 12 * (W - ml - mr); } function Y(v) { return mt + (hi - v) / (hi - lo) * (H - mt - mb); }
    var s = '';
    for (var v = lo; v <= hi + 1; v += step) s += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="' + (Math.abs(v) < 1 ? '#14161a' : '#d3d6cb') + '" stroke-width="1"/><text x="' + (ml - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="12" fill="#4b505a">' + shortMoney(v) + '</text>';
    for (var a = 18; a <= 30; a += 2) s += '<text x="' + X(a) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="12" fill="#4b505a">' + a + '</text>';
    s += '<path d="' + pts.map(function (p, i) { return (i ? 'L' : 'M') + X(p.age).toFixed(1) + ' ' + Y(p.v).toFixed(1); }).join('') + '" fill="none" stroke="#1d58a6" stroke-width="2.5" stroke-linejoin="round"/>';
    pts.forEach(function (p) { s += '<circle cx="' + X(p.age).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="4" fill="#1d58a6" stroke="#fff" stroke-width="2"/>'; });
    var last = pts[pts.length - 1];
    s += '<text x="' + (X(last.age) + 9) + '" y="' + (Y(last.v) + 4) + '" font-size="13" font-weight="700" fill="#14161a">' + shortMoney(last.v) + '</text>';
    s += '<line id="xh" x1="0" x2="0" y1="' + mt + '" y2="' + (H - mb) + '" stroke="#14161a" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>';
    return { html: '<div class="chart" id="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Line chart of net worth from age 18 to 30. It ends at ' + money(last.v) + '.">' + s + '</svg><div class="tip" id="tip"></div></div>', X: X, Y: Y, W: W, H: H };
  }
  ui.end = function (S, rep) {
    return new Promise(function () {
      S.stage = 'pre'; drawStrip(S); refreshSide();
      var pts = [{ age: 18, v: S.card.head + (S.card.car ? 3800 : 0) }].concat(S.hist.map(function (h) { return { age: h[0] + 1, v: h[1] }; }));
      var ch = chartHtml(pts), html = '', stu = S.loan.fed + S.loan.priv;
      html += '<div class="grade"><div class="letter">' + pix(rep.grade, 9) + '</div><div><h3 style="font-size:1.4rem">' + esc(rep.title) + '</h3><p class="sub">' + esc(S.name) + ', age 30. ' + esc(statusLine(S)) + (S.job ? ', earning ' + money(S.job.sal) + ' a year' : '') + '.</p><p style="margin-top:6px">Proof code <span class="code">' + rep.code + '</span></p></div></div>';
      html += '<div class="plate">' + [['Net worth', money(rep.nw)], ['Credit score', S.credit + ', ' + creditWord(S.credit).toLowerCase()], ['Happiness', rep.happy + ' of 100'], ['Still owed', money(debtTotal(S))]].map(function (t) { return '<div class="tile"><span class="sub small">' + t[0] + '</span><b>' + t[1] + '</b></div>'; }).join('') + '</div>';
      html += '<div class="tile" style="margin-top:14px"><h3>How the grade adds up</h3><div class="bars">' + rep.parts.map(function (p) { return '<div class="b"><span>' + p[0] + '</span><div class="track"><div class="fill" style="width:' + Math.round(p[1]) + '%"></div></div><span>' + esc(p[2]) + '</span></div>'; }).join('') + '</div><p class="sub small" style="margin-top:6px">Net worth counts 35%, happiness 25%, credit 20%, debt 20%.' + (S.rock ? ' Hitting rock bottom cost a few points.' : '') + '</p></div>';
      html += '<div class="tile" style="margin-top:14px"><h3>Your net worth, age 18 to 30</h3>' + ch.html + '<details><summary>Show the numbers</summary><table class="data"><tr><th>Age</th><th>Net worth</th><th>Debt</th><th>Investments</th><th>Savings</th><th>Credit</th><th>Pay that year</th></tr>' + S.hist.map(function (h) { return '<tr><td>' + h[0] + '</td><td>' + money(h[1]) + '</td><td>' + money(h[2]) + '</td><td>' + money(h[3]) + '</td><td>' + money(h[4]) + '</td><td>' + h[5] + '</td><td>' + money(h[7]) + '</td></tr>'; }).join('') + '</table></details></div>';
      html += '<div class="cols">';
      html += '<div class="tile"><h3>The road you took</h3><ul class="log">' + S.log.map(function (l) { return '<li><b>' + l[0] + '</b> ' + esc(l[1]) + '</li>'; }).join('') + '</ul></div><div>';
      if (S.loan.borrowed > 0) html += '<div class="tile"><h3>Student loans</h3><p>You borrowed ' + money(S.loan.borrowed) + ' for school and still owe ' + money(stu) + '.</p></div>';
      if (S.lotto.spent > 0) {
        var mx = Math.max(S.lotto.spent, S.lotto.won, S.lotto.shadow, 1);
        html += '<div class="tile" style="margin-top:' + (S.loan.borrowed > 0 ? 14 : 0) + 'px"><h3>Your lottery ledger</h3><div class="bars">' + [['Spent on tickets', S.lotto.spent], ['Won back', S.lotto.won], ['If invested instead', S.lotto.shadow]].map(function (b) { return '<div class="b"><span>' + b[0] + '</span><div class="track"><div class="fill" style="width:' + Math.round(b[1] / mx * 100) + '%"></div></div><span>' + money(b[1]) + '</span></div>'; }).join('') + '</div><p class="sub small" style="margin-top:6px">The last bar is what the same dollars would be worth today in the index fund.</p></div>';
      }
      html += '<div class="tile" style="margin-top:14px"><h3>Math challenges</h3><p>' + S.math.r + ' right out of ' + S.math.n + ' tried.</p></div></div></div>';
      html += '<div class="tile" style="margin-top:14px"><h3>Think it over</h3><ol class="q"><li>Which single decision changed your net worth the most? What is your evidence?</li><li>Find a year your net worth dropped. What caused it, and what would have softened the blow?</li><li>Compare with someone who took a different path. Who is ahead at 30? Who do you predict is ahead at 40, and why?</li><li>Where did exponential growth work for you in this game, and where did it work against you?</li>' + (S.lotto.spent > 0 ? '<li>You got back ' + Math.round(S.lotto.won / S.lotto.spent * 100) + ' cents for every lottery dollar. Why do people keep playing?</li>' : '') + '</ol></div>';
      html += '<div class="go"><button class="btn primary" id="copy">Copy my results</button><button class="btn" id="again">Play again</button><span class="key">To turn this in, screenshot this page or paste your copied results into Canvas.</span></div>';
      main.innerHTML = signHtml('info', 'You made it to 30', html); top();
      var chart = main.querySelector('#chart'), tip = main.querySelector('#tip'), xh = main.querySelector('#xh'), svg = chart.querySelector('svg');
      svg.addEventListener('mousemove', function (ev) {
        var r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * ch.W, best = pts[0];
        pts.forEach(function (p) { if (Math.abs(ch.X(p.age) - x) < Math.abs(ch.X(best.age) - x)) best = p; });
        xh.setAttribute('x1', ch.X(best.age)); xh.setAttribute('x2', ch.X(best.age)); xh.setAttribute('visibility', 'visible');
        tip.style.display = 'block'; tip.style.left = (ch.X(best.age) / ch.W * r.width) + 'px'; tip.style.top = (ch.Y(best.v) / ch.H * r.height) + 'px'; tip.textContent = 'Age ' + best.age + ': ' + money(best.v);
      });
      svg.addEventListener('mouseleave', function () { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); });
      main.querySelector('#copy').onclick = function () {
        var t = ['THE TRAIL TO 30: results for ' + S.name, 'Grade: ' + rep.grade + ' (' + rep.title + ')   Proof code: ' + rep.code + (S.cls ? '   Class code: ' + S.world : ''), 'At 30: ' + statusLine(S) + (S.job ? ', ' + money(S.job.sal) + ' a year' : ''), 'Net worth: ' + money(rep.nw) + '   Debt: ' + money(debtTotal(S)) + '   Credit score: ' + S.credit + '   Happiness: ' + rep.happy + '/100', 'Student loans borrowed: ' + money(S.loan.borrowed) + '   Lottery: spent ' + money(S.lotto.spent) + ', won ' + money(S.lotto.won), 'Math challenges: ' + S.math.r + ' of ' + S.math.n, 'Net worth by age: ' + pts.map(function (p) { return p.age + ': ' + money(p.v); }).join(', '), 'The road: ' + S.log.map(function (l) { return l[0] + ' ' + l[1]; }).join('; ')].join('\n');
        copyText(t, 'Results copied. Paste them into Canvas.');
      };
      main.querySelector('#again').onclick = function () { confirmBox('Start over?', 'This erases the life you just finished from this Chromebook. Copy your results first if you need to turn them in.', 'Start over').then(function (ok) { if (ok) { try { localStorage.removeItem(STORE); } catch (e) { } GAME = null; lastX = null; title(); } }); };
    });
  };

  /* ---------- modals ---------- */
  function showModal(sign, titleText, body) { modal.innerHTML = signHtml(sign, titleText, body); modal.className = 'on'; var f = modal.querySelector('button, textarea, input'); if (f) f.focus(); }
  function closeModal() { modal.className = ''; modal.innerHTML = ''; }
  modal.addEventListener('click', function (ev) { if (ev.target === modal && !modal.hasAttribute('data-hold')) closeModal(); });
  function confirmBox(titleText, text, yes) {
    return new Promise(function (res) {
      showModal('guide', titleText, paras(text) + '<div class="go"><button class="btn primary" id="yes">' + esc(yes) + '</button><button class="btn" id="no">Never mind</button></div>');
      modal.setAttribute('data-hold', '1');
      function fin(v) { modal.removeAttribute('data-hold'); closeModal(); res(v); }
      modal.querySelector('#yes').onclick = function () { fin(true); }; modal.querySelector('#no').onclick = function () { fin(false); };
    });
  }
  function copyText(t, msg) {
    function fallback() { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(msg); } catch (e) { toast('Copy did not work here. Select the text and press Ctrl+C.'); } ta.remove(); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { toast(msg); }, fallback); else fallback();
  }
  function saveModal() {
    var S = GAME; if (!S) return;
    showModal('info', 'Save code', '<p>This code brings you back to the start of age ' + S.age + '. The game also saves on this Chromebook by itself, but the code works anywhere: paste it into Canvas or a doc to finish another day.</p><textarea readonly id="sv" style="margin-top:10px">' + esc(lastCode) + '</textarea><div class="go"><button class="btn primary" id="cp">Copy the code</button><button class="btn" id="cl">Close</button></div>');
    modal.querySelector('#cp').onclick = function () { copyText(lastCode, 'Save code copied.'); }; modal.querySelector('#cl').onclick = closeModal;
  }
  function loadModal() {
    showModal('guide', 'Load a save code', '<p>Paste the whole code, starting with T30.</p><textarea id="ld" style="margin-top:10px" aria-label="Save code"></textarea><p class="why" id="lderr" style="color:var(--bad);font-weight:600"></p><div class="go"><button class="btn primary" id="go">Load</button><button class="btn" id="cl">Close</button></div>');
    modal.querySelector('#cl').onclick = closeModal;
    modal.querySelector('#go').onclick = function () { var S = decodeSave(modal.querySelector('#ld').value); if (!S) { modal.querySelector('#lderr').textContent = 'That code did not work. Make sure you copied all of it, with nothing extra before or after.'; return; } closeModal(); begin(S); };
  }
  function helpModal() {
    showModal('info', 'How to play', '<p>Each turn is one year of your life, from 18 to 30.</p><h3>Every year</h3><ul><li><b>Plan.</b> Choose where you live, how you get around, and what you spend. The “Your month” box shows whether your paycheck covers it.</li><li><b>Live.</b> Things happen. Some you choose, some choose you.</li><li><b>Review.</b> See where the money went and how your net worth changed.</li></ul><h3>How you are graded at 30</h3><ul><li>Net worth: what you own minus what you owe.</li><li>Happiness: a life with no fun and 60-hour weeks scores badly here.</li><li>Credit score: it sets the interest rate on your loans.</li><li>Debt compared with your income.</li></ul><h3>Good to know</h3><ul><li>If you spend more than you make, the gap goes on a credit card at 25% interest (or onto your student loans while you are in school).</li><li>\u201cChange path\u201d on the plan screen lets you switch jobs, go back to school, or leave school.</li><li>Number keys pick choices. Enter continues.</li></ul><div class="go"><button class="btn primary" id="cl">Got it</button></div>');
    modal.querySelector('#cl').onclick = closeModal;
  }
  function moveModal(S, redraw) {
    var opts = [];
    [0.25, 0.5, 1].forEach(function (f) { if (S.cash >= 100) opts.push({ t: 'Invest ' + money(S.cash * f) + ' of your savings', s: f === 1 ? 'Everything. You would have no cash cushion.' : Math.round(f * 100) + '% of your savings into the index fund.', run: function () { var a = Math.floor(S.cash * f); S.cash -= a; S.inv += a; S.invPaid += a; } }); });
    [0.25, 0.5, 1].forEach(function (f) { if (S.inv >= 100) opts.push({ t: 'Sell ' + money(S.inv * f) + ' of your investments', s: 'Moves ' + Math.round(f * 100) + '% of your index fund back to savings.', run: function () { var a = Math.floor(S.inv * f); S.inv -= a; S.cash += a; } }); });
    showModal('guide', 'Move money', '<p>Savings are safe and earn about 4%. The index fund has averaged more over long stretches, but it can drop by a third in a bad year. You have ' + money(S.cash) + ' in savings and ' + money(S.inv) + ' in the fund.</p><div class="opts">' + opts.map(function (o, i) { return '<button class="opt" data-i="' + i + '"><span><span class="t">' + esc(o.t) + '</span><span class="s">' + esc(o.s) + '</span></span></button>'; }).join('') + '</div><div class="go"><button class="btn" id="cl">Close</button></div>');
    Array.prototype.forEach.call(modal.querySelectorAll('.opt'), function (b) { b.onclick = function () { opts[+b.getAttribute('data-i')].run(); closeModal(); redraw(); }; });
    modal.querySelector('#cl').onclick = closeModal;
  }
  function teacherModal() {
    showModal('info', 'Teacher notes', document.getElementById('teacher-notes').innerHTML + '<div class="go"><button class="btn primary" id="cl">Close</button></div>');
    modal.querySelector('#cl').onclick = closeModal;
    function v(id) { return modal.querySelector('#pv-' + id).value; }
    function upd() { var nw = parseFloat(v('nw').replace(/[^0-9.\-\u2212]/g, '').replace('\u2212', '-')); modal.querySelector('#pv-out').textContent = v('name') && isFinite(nw) && v('cr') && v('hp') && v('gr') ? proofCode(v('name'), v('cls'), nw, +v('cr'), +v('hp'), v('gr')) : '------'; }
    Array.prototype.forEach.call(modal.querySelectorAll('input'), function (el) { el.oninput = upd; });
  }

  /* ---------- title, starting hand, boot ---------- */
  function title() {
    GAME = null; lastX = null; drawStrip(null); refreshSide();
    var saved = null; try { saved = decodeSave(localStorage.getItem(STORE) || ''); } catch (e) { }
    var body = '<div style="color:var(--green)">' + pix('The Trail to 30', 7) + '</div><p style="margin-top:14px;font-size:1.1rem;max-width:56ch">You are 18. You have a diploma, a little money, and twelve years to make something of both. College, a trade, the military, or straight to work: every road costs something and pays something.</p><p class="sub" style="margin-top:8px;max-width:60ch">One turn is one year. Plan your budget, live with what happens, and see where you stand at 30. No two lives come out the same.</p>';
    if (saved) body += '<div class="go"><button class="btn primary" id="resume">Continue as ' + esc(saved.name) + ', age ' + saved.age + '</button></div><p class="sub small" style="margin-top:14px">Or start someone new:</p>';
    body += '<div class="field"><label for="nm">Your name</label><input id="nm" maxlength="24" autocomplete="off" placeholder="First name and last initial"></div><div class="field"><label for="cc">Class code</label><input id="cc" maxlength="12" autocomplete="off" placeholder="Leave blank unless your teacher gave you one"><span class="hint">Everyone with the same code lives through the same economy and the same order of events.</span></div><div class="go"><button class="btn' + (saved ? '' : ' primary') + '" id="start">Start a new life</button><button class="btn" id="load">Load a save code</button></div>';
    main.innerHTML = '<section class="sign title-sign" data-sign="guide"><div class="sign-body">' + body + '</div></section><footer class="foot"><button id="tn">Teacher notes</button><button id="hp">How to play</button>' + (window.self !== window.top ? '<a href="' + esc(location.href) + '" target="_blank" rel="noopener" style="color:inherit">Open in its own tab</a>' : '') + '</footer>';
    var nm = main.querySelector('#nm');
    function go() { var name = nm.value.trim().replace(/\s+/g, ' '); if (!name) { nm.focus(); toast('Type your name first.'); return; } if (saved) { confirmBox('Start a new life?', 'This replaces the saved game for ' + saved.name + ' on this Chromebook.', 'Start new').then(function (ok) { if (ok) hand(newGame(name, main.querySelector('#cc').value)); }); } else hand(newGame(name, main.querySelector('#cc').value)); }
    main.querySelector('#start').onclick = go; nm.onkeydown = function (ev) { if (ev.key === 'Enter') go(); };
    main.querySelector('#load').onclick = loadModal; main.querySelector('#tn').onclick = teacherModal; main.querySelector('#hp').onclick = helpModal;
    if (saved) main.querySelector('#resume').onclick = function () { begin(saved); };
  }
  function hand(S) {
    GAME = null; var c = S.card, P = PERKS[c.perk];
    var tiles = [['Your grades', c.gpa.toFixed(1) + ' GPA', 'Decides scholarships and which programs will take you.'], ['Head start', money(c.head), 'Graduation gifts and what you saved from summer jobs.'], ['Wheels', c.car ? 'A hand-me-down car' : 'None yet', c.car ? 'It has 190,000 miles and a mystery rattle, but it runs.' : 'You get around by bus, bike, and friends for now.'], ['Your strength', P.name, P.desc]];
    main.innerHTML = signHtml('guide', 'Your starting hand', '<p>Nobody starts from the same spot. This is where ' + esc(S.name) + ' starts.</p><div class="hand">' + tiles.map(function (t) { return '<div class="tile"><span class="k">' + t[0] + '</span><b>' + esc(t[1]) + '</b><span class="sub small">' + esc(t[2]) + '</span></div>'; }).join('') + '</div>' + (S.cls ? '<p class="sub small" style="margin-top:12px">Class code ' + esc(S.world) + '.</p>' : '') + contBtn('Graduate'));
    top(); var b = main.querySelector('#cont'); b.onclick = function () { begin(S); }; b.focus({ preventScroll: true });
  }
  function begin(S) {
    GAME = S; lastX = null;
    runGame(S, ui).catch(function (err) {
      if (GAME !== S) return;
      main.innerHTML = signHtml('stop', 'Something broke', '<p>The game hit an error and stopped. Your progress up to the start of this year is saved. Copy your save code, reload the page, and load the code to keep going.</p><p class="sub small" style="margin-top:8px">' + esc(String(err && err.message || err)) + '</p><div class="go"><button class="btn primary" id="sv2">Show my save code</button></div>');
      main.querySelector('#sv2').onclick = saveModal;
    });
  }
  document.addEventListener('keydown', function (ev) {
    if (modal.className === 'on') { if (ev.key === 'Escape' && !modal.hasAttribute('data-hold')) closeModal(); return; }
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var tag = ev.target && ev.target.tagName; if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (/^[0-9]$/.test(ev.key)) { var idx = ev.key === '0' ? 9 : +ev.key - 1, b = main.querySelectorAll('.opts[data-live] .opt')[idx]; if (b && !b.disabled) { ev.preventDefault(); b.click(); } }
  });
  title();
})();

</script>
</body>
